openapi: 3.0.3
info:
  title: API do Sistema de Biblioteca Escolar
  description: >
    API REST para gestão de um sistema de biblioteca escolar, com recursos de
    livros, estudantes e empréstimos. Dados mantidos em memória (Trabalho 1 —
    Design e Implementação de uma API REST).
  version: "1.0.0"
  contact:
    name: Equipe do Trabalho 1
servers:
  - url: http://localhost:3000/api/v1
    description: Servidor local de desenvolvimento

tags:
  - name: Livros
    description: Acervo de livros disponíveis na biblioteca
  - name: Estudantes
    description: Usuários do sistema
  - name: Empréstimos
    description: Relação entre livros e estudantes

paths:
  /livros:
    get:
      tags: [Livros]
      summary: Lista livros do acervo
      description: Suporta filtro por gênero, busca por título/autor, filtro por ano, paginação e ordenação combinada.
      parameters:
        - name: genero
          in: query
          schema: { type: string }
          example: ficcao
          description: Filtra por gênero exato
        - name: titulo
          in: query
          schema: { type: string }
          example: dom
          description: Busca por palavra-chave no título (case-insensitive)
        - name: autor
          in: query
          schema: { type: string }
          description: Busca por palavra-chave no nome do autor
        - name: anoPublicacao
          in: query
          schema: { type: integer }
          description: Filtra por ano de publicação exato
        - name: ano_min
          in: query
          schema: { type: integer }
          description: Filtra livros publicados a partir deste ano
        - name: ano_max
          in: query
          schema: { type: integer }
          description: Filtra livros publicados até este ano
        - name: sort
          in: query
          schema: { type: string }
          example: "-anoPublicacao,titulo"
          description: Ordenação combinada por múltiplos campos (prefixo "-" para descendente)
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Lista paginada de livros
          content:
            application/json:
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items: { $ref: "#/components/schemas/Livro" }
                  paginacao: { $ref: "#/components/schemas/Paginacao" }
              example:
                dados:
                  - id: 3
                    titulo: Duna
                    autor: Frank Herbert
                    genero: ficcao
                    isbn: "978-85-254-1111-6"
                    anoPublicacao: 1965
                    quantidadeTotal: 4
                    quantidadeDisponivel: 2
                paginacao: { total: 1, paginaAtual: 1, totalPaginas: 1, limit: 10 }
    post:
      tags: [Livros]
      summary: Cadastra um novo livro
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NovoLivro" }
            example:
              titulo: Neuromancer
              autor: William Gibson
              genero: ficcao
              isbn: "978-85-000-0000-1"
              anoPublicacao: 1984
              quantidadeTotal: 2
      responses:
        "201":
          description: Livro criado com sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Livro" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "409": { $ref: "#/components/responses/Conflito" }

  /livros/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Livros]
      summary: Retorna um livro específico
      responses:
        "200":
          description: Livro encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Livro" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
    put:
      tags: [Livros]
      summary: Substitui um livro existente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NovoLivro" }
      responses:
        "200":
          description: Livro substituído com sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Livro" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409": { $ref: "#/components/responses/Conflito" }
    patch:
      tags: [Livros]
      summary: Atualiza parcialmente um livro
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LivroParcial" }
            example: { quantidadeTotal: 10 }
      responses:
        "200":
          description: Livro atualizado com sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Livro" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409": { $ref: "#/components/responses/Conflito" }
    delete:
      tags: [Livros]
      summary: Remove um livro
      responses:
        "204": { description: Livro removido com sucesso }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409": { $ref: "#/components/responses/Conflito" }

  /estudantes:
    get:
      tags: [Estudantes]
      summary: Lista estudantes cadastrados
      parameters:
        - name: turma
          in: query
          schema: { type: string }
        - name: nome
          in: query
          schema: { type: string }
          description: Busca por palavra-chave no nome
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Lista paginada de estudantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items: { $ref: "#/components/schemas/Estudante" }
                  paginacao: { $ref: "#/components/schemas/Paginacao" }
    post:
      tags: [Estudantes]
      summary: Cadastra um novo estudante
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NovoEstudante" }
            example:
              nome: Daniela Ferreira
              email: daniela.ferreira@escola.edu.br
              matricula: "2024004"
              turma: 3B
      responses:
        "201":
          description: Estudante criado com sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estudante" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "409": { $ref: "#/components/responses/Conflito" }

  /estudantes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Estudantes]
      summary: Retorna um estudante específico
      responses:
        "200":
          description: Estudante encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estudante" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
    put:
      tags: [Estudantes]
      summary: Substitui um estudante existente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NovoEstudante" }
      responses:
        "200":
          description: Estudante substituído com sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estudante" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409": { $ref: "#/components/responses/Conflito" }
    patch:
      tags: [Estudantes]
      summary: Atualiza parcialmente um estudante
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstudanteParcial" }
            example: { turma: 3C }
      responses:
        "200":
          description: Estudante atualizado com sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estudante" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409": { $ref: "#/components/responses/Conflito" }
    delete:
      tags: [Estudantes]
      summary: Remove um estudante
      responses:
        "204": { description: Estudante removido com sucesso }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409": { $ref: "#/components/responses/Conflito" }

  /estudantes/{id}/emprestimos:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Estudantes, Empréstimos]
      summary: Lista os empréstimos de um estudante (recurso aninhado)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ativo, devolvido, atrasado] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Lista paginada de empréstimos do estudante
          content:
            application/json:
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items: { $ref: "#/components/schemas/Emprestimo" }
                  paginacao: { $ref: "#/components/schemas/Paginacao" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /emprestimos:
    get:
      tags: [Empréstimos]
      summary: Lista empréstimos
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ativo, devolvido, atrasado] }
        - name: estudanteId
          in: query
          schema: { type: integer }
        - name: livroId
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Lista paginada de empréstimos
          content:
            application/json:
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items: { $ref: "#/components/schemas/Emprestimo" }
                  paginacao: { $ref: "#/components/schemas/Paginacao" }
    post:
      tags: [Empréstimos]
      summary: Registra um novo empréstimo
      description: Falha com 409 se não houver exemplares disponíveis do livro.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NovoEmprestimo" }
            example:
              livroId: 2
              estudanteId: 3
              dataEmprestimo: "2026-09-05"
              dataDevolucaoPrevista: "2026-09-19"
      responses:
        "201":
          description: Empréstimo criado com sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Emprestimo" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409": { $ref: "#/components/responses/Conflito" }

  /emprestimos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Empréstimos]
      summary: Retorna um empréstimo específico
      responses:
        "200":
          description: Empréstimo encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Emprestimo" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
    put:
      tags: [Empréstimos]
      summary: Substitui um empréstimo existente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NovoEmprestimo" }
      responses:
        "200":
          description: Empréstimo substituído com sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Emprestimo" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
    patch:
      tags: [Empréstimos]
      summary: Atualiza parcialmente um empréstimo (ex. registrar devolução)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmprestimoParcial" }
            example: { status: devolvido, dataDevolucaoReal: "2026-09-10" }
      responses:
        "200":
          description: Empréstimo atualizado com sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Emprestimo" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
    delete:
      tags: [Empréstimos]
      summary: Remove um empréstimo
      responses:
        "204": { description: Empréstimo removido com sucesso }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

components:
  schemas:
    Paginacao:
      type: object
      properties:
        total: { type: integer, example: 5 }
        paginaAtual: { type: integer, example: 1 }
        totalPaginas: { type: integer, example: 1 }
        limit: { type: integer, example: 10 }

    Erro:
      type: object
      properties:
        erro:
          type: object
          properties:
            codigo: { type: string, example: RECURSO_NAO_ENCONTRADO }
            mensagem: { type: string, example: "Livro com id 42 não encontrado" }

    NovoLivro:
      type: object
      required: [titulo, autor, genero, isbn, anoPublicacao, quantidadeTotal]
      properties:
        titulo: { type: string }
        autor: { type: string }
        genero: { type: string }
        isbn: { type: string }
        anoPublicacao: { type: integer }
        quantidadeTotal: { type: integer }
        quantidadeDisponivel: { type: integer }
    LivroParcial:
      allOf:
        - $ref: "#/components/schemas/NovoLivro"
      description: Todos os campos são opcionais no PATCH
    Livro:
      allOf:
        - type: object
          properties:
            id: { type: integer, example: 1 }
        - $ref: "#/components/schemas/NovoLivro"

    NovoEstudante:
      type: object
      required: [nome, email, matricula, turma]
      properties:
        nome: { type: string }
        email: { type: string, format: email }
        matricula: { type: string }
        turma: { type: string }
    EstudanteParcial:
      allOf:
        - $ref: "#/components/schemas/NovoEstudante"
      description: Todos os campos são opcionais no PATCH
    Estudante:
      allOf:
        - type: object
          properties:
            id: { type: integer, example: 1 }
        - $ref: "#/components/schemas/NovoEstudante"

    NovoEmprestimo:
      type: object
      required: [livroId, estudanteId, dataEmprestimo, dataDevolucaoPrevista]
      properties:
        livroId: { type: integer }
        estudanteId: { type: integer }
        dataEmprestimo: { type: string, format: date }
        dataDevolucaoPrevista: { type: string, format: date }
    EmprestimoParcial:
      type: object
      properties:
        livroId: { type: integer }
        estudanteId: { type: integer }
        dataEmprestimo: { type: string, format: date }
        dataDevolucaoPrevista: { type: string, format: date }
        dataDevolucaoReal: { type: string, format: date, nullable: true }
        status: { type: string, enum: [ativo, devolvido, atrasado] }
    Emprestimo:
      allOf:
        - type: object
          properties:
            id: { type: integer, example: 1 }
            status: { type: string, enum: [ativo, devolvido, atrasado] }
            dataDevolucaoReal: { type: string, format: date, nullable: true }
        - $ref: "#/components/schemas/NovoEmprestimo"

  responses:
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example:
            erro: { codigo: RECURSO_NAO_ENCONTRADO, mensagem: "Livro com id 42 não encontrado" }
    EntradaInvalida:
      description: Dados de entrada inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example:
            erro: { codigo: ENTRADA_INVALIDA, mensagem: "titulo: título é obrigatório" }
    Conflito:
      description: Conflito com o estado atual do recurso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example:
            erro: { codigo: ISBN_DUPLICADO, mensagem: "Já existe um livro cadastrado com o ISBN 978-85-000-0000-1" }
